[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-automation-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "anthropic>=0.69,<1",
  "boto3>=1.34,<2",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "imagehash>=4.3,<5",
  "jinja2>=3.1,<4",
  "opencv-python-headless>=4.9,<5",
  "openpyxl>=3.1,<4",
  "pillow>=10,<12",
  "pillow-heif>=1,<2",
  "pydantic-settings>=2.6,<3",
  "pytesseract>=0.3,<1",
  "python-multipart>=0.0.20,<1",
  # Pinned exactly: 2.0.70+ requires pillow>=12.1, which conflicts with
  # this project's <12 pin. 2.0.69 is the newest release before that
  # requirement was added, and has no pillow constraint of its own.
  "rembg[cpu]==2.0.69",
  # For the foil (holo/reverse-holo) classifier: local-binary-pattern
  # texture features (scikit-image) feeding a small classical classifier
  # (scikit-learn) -- see scan_ingest/foil_features.py and
  # scripts/train_foil_classifier.py.
  "scikit-image>=0.24,<1",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
# Starlette 1.x still falls back to legacy httpx when httpx2 is absent, but
# that compatibility path hangs this suite's TestClient requests.  httpx is
# retained above for the application's outbound clients; httpx2 is the
# test-client runtime Starlette now prefers.
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1", "httpx2>=2,<3"]

[tool.setuptools.packages.find]
include = ["automation_control*"]

# Non-Python files the package reads at runtime. Editable installs find
# these in the source tree regardless, so a missing entry here only bites
# on a real build -- which is exactly when it would be hardest to spot.
[tool.setuptools.package-data]
automation_control = ["data/*.csv", "listing_pipeline/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project root, so tests can import both automation_control (installed
# as a package) and scripts/ (maintenance tools, not part of the
# distribution but with behaviour worth testing).
pythonpath = ["."]
asyncio_mode = "auto"
# A full suite creates roughly 2 GB of throwaway SQLite fixtures. Pytest's
# default retention of three successful runs can fill this host's 5.9 GB tmpfs
# and turn every later database setup into a misleading "disk is full" failure.
tmp_path_retention_count = 1
tmp_path_retention_policy = "none"
