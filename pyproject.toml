[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-automation-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.69,<1",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "pillow>=10,<12",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
include = ["automation_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
